points:
  zones:
    matrix:
    # a rotated point and its mirror image show how the debug arrows follow the orientation
    rotated:
      anchor:
        shift: [30, 0]
        rotate: 30
      mirror.distance: 30
outlines:
  # each switch is drawn as seen from the top, centered on its point
  alps:
    - what: alps
      where: matrix
  chocv1:
    - what: choc_v1
      where: matrix
  chocv2:
    - what: choc_v2
      where: matrix
  mx:
    - what: mx
      where: matrix
  debug:
    - what: debug
      where: true