points.zones.matrix:
outlines:
  # a decoration without a footprint, made of the three strokes of the logo
  logo:
    - what: ergogen_logo
      where: true
  # each outline matches the built-in footprint of the same name, seen from the top
  jstph:
    - what: jstph
      where: true
  oled:
    - what: oled
      where: true
  promicro:
    - what: promicro
      where: true
  rgb:
    - what: rgb
      where: true
  # details like the knob stay visible as separate loops
  rotary:
    - what: rotary
      where: true
  scrollwheel:
    - what: scrollwheel
      where: true
  trrs:
    - what: trrs
      where: true